spring.application.name=filecabinet-dms-distributed
server.port=8081
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/filecabinet_distr
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
logging.level.org.hibernate.persister.entity=ERROR

# File uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
filecabinet.upload-dir=${UPLOAD_DIR:uploads}

# JWT
security.jwt.secret=${JWT_SECRET:change-this-in-production-filecabinet-dms-secret-key-256bit}
security.jwt.expiration-ms=86400000

# Extraction microservice (Feign)
extraction.service.url=${EXTRACTION_SERVICE_URL:http://localhost:8082}

# Redis cache
spring.cache.type=redis
spring.data.redis.repositories.enabled=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
