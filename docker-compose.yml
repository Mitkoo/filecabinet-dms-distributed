services:
  postgres-main:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: filecabinet_distr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - main-db:/var/lib/postgresql/data

  postgres-extraction:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: filecabinet_extraction
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - extraction-db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  extraction-svc:
    build:
      context: .
      dockerfile: extraction-svc/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-extraction:5432/filecabinet_extraction
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
    ports:
      - "8082:8082"
    depends_on:
      - postgres-extraction

  main-app:
    build:
      context: .
      dockerfile: main-app/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-main:5432/filecabinet_distr
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EXTRACTION_SERVICE_URL: http://extraction-svc:8082
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-filecabinet-dms-secret-key-256bit}
    ports:
      - "8081:8081"
    depends_on:
      - postgres-main
      - redis
      - extraction-svc

volumes:
  main-db:
  extraction-db:
