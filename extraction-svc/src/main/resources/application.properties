spring.application.name=extraction-svc
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/filecabinet_extraction
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.ai.mistralai.api-key=${MISTRAL_API_KEY}
spring.ai.mistralai.chat.options.model=mistral-small-latest
spring.ai.mistralai.chat.options.temperature=0

management.endpoints.web.exposure.include=health,info
